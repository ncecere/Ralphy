# Ralphy configuration
# Values here are used as defaults and can be overridden by flags or env vars.

# AI engine: claude, opencode, cursor, codex
ai_engine: claude

# Task source: markdown, yaml, github
prd_source: markdown

# Files
prd_file: PRD.md

# Workflow
skip_tests: false
skip_lint: false
dry_run: false
max_iterations: 0
max_retries: 3
retry_delay: 5
verbose: false

# Parallel execution
parallel: false
max_parallel: 3

# Git workflow
branch_per_task: false
base_branch: ""
create_pr: false
pr_draft: false

# GitHub integration
github_repo: ""
github_label: ""
# Supports GITHUB_TOKEN, GH_TOKEN, or this explicit value
github_token: ""
