# Ralphy configuration
# This file can be placed at:
#   - ~/.config/ralphy/ralphy.yaml (global)
#   - ./ralphy.yaml (project-local, overrides global)
#
# Config precedence (highest to lowest):
#   1. Command-line flags
#   2. Environment variables
#   3. Local config (./ralphy.yaml)
#   4. Global config (~/.config/ralphy/ralphy.yaml)

# AI engine: claude, opencode, cursor, codex
ai_engine: claude

# Per-engine model defaults
# Use `ralphy models --<engine>` to list available models
# Use `ralphy models --<engine> --set-default` to set interactively
models:
  claude: ""      # e.g., opus, sonnet, haiku
  opencode: ""    # e.g., anthropic/claude-sonnet-4-5, openai/gpt-5.2
  codex: ""
  cursor: ""

# Task source: markdown, yaml, github
prd_source: markdown

# Files
prd_file: PRD.md

# Workflow
skip_tests: false
skip_lint: false
dry_run: false
max_iterations: 0
max_retries: 3
retry_delay: 5
verbose: false

# Parallel execution
parallel: false
max_parallel: 3

# Git workflow
branch_per_task: false
base_branch: ""
create_pr: false
pr_draft: false

# GitHub integration
github_repo: ""
github_label: ""
# Supports GITHUB_TOKEN, GH_TOKEN, or this explicit value
github_token: ""
