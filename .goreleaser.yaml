# GoReleaser configuration
# See: https://goreleaser.com/customization/

version: 2

project_name: ralphy

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: ralphy
    main: ./cmd/ralphy
    binary: ralphy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildTime={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE*
      - ralphy.yaml
      - examples/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: ncecere
    name: ralphy
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Ralphy {{ .Tag }}

    Autonomous AI coding loop that runs AI assistants to work through tasks.
  footer: |
    ---
    
    **Full Changelog**: https://github.com/ncecere/ralphy/compare/{{ .PreviousTag }}...{{ .Tag }}

