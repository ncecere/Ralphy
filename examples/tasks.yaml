# Example YAML Tasks File
#
# This format is useful when you need more structured task metadata.
# Ralphy preserves YAML formatting when updating task statuses.
#
# Supported fields:
#   title: (required) Task description
#   completed: true/false - whether task is done
#   parallel_group: integer - tasks with same group run concurrently
#
# Additional metadata fields (for documentation, not used by ralphy):
#   priority, tags, notes, depends_on, subtasks, acceptance_criteria

project: example-api
version: "1.0"

tasks:
  # ===========================================================================
  # PARALLEL GROUP 1: Setup phase
  # These tasks have no dependencies and can run concurrently
  # ===========================================================================
  - title: Initialize Go module and project structure
    completed: false
    parallel_group: 1
    tags: [setup, infrastructure]

  - title: Set up configuration management with Viper
    completed: false
    parallel_group: 1
    tags: [setup, config]

  - title: Create database connection pool with PostgreSQL
    completed: false
    parallel_group: 1
    tags: [setup, database]
    notes: Use pgxpool for connection pooling

  # ===========================================================================
  # PARALLEL GROUP 2: Authentication phase
  # These run after setup completes. Registration and login can run in parallel.
  # ===========================================================================
  - title: Implement user registration endpoint (POST /api/auth/register)
    completed: false
    parallel_group: 2
    tags: [auth, api]
    acceptance_criteria:
      - Validate email format
      - Hash passwords with bcrypt
      - Return JWT token on success

  - title: Implement user login endpoint with JWT tokens
    completed: false
    parallel_group: 2
    tags: [auth, api]

  # ===========================================================================
  # PARALLEL GROUP 3: Auth middleware (depends on login being done)
  # ===========================================================================
  - title: Add middleware for JWT token validation
    completed: false
    parallel_group: 3
    tags: [auth, middleware]

  - title: Implement password reset flow
    completed: false
    parallel_group: 3
    tags: [auth, api]

  # ===========================================================================
  # PARALLEL GROUP 4: Core features (depend on auth middleware)
  # These can all run in parallel since they're independent features
  # ===========================================================================
  - title: Create todo CRUD endpoints
    completed: false
    parallel_group: 4
    tags: [api, todos]
    subtasks:
      - GET /api/todos - list all todos
      - POST /api/todos - create new todo
      - GET /api/todos/:id - get single todo
      - PUT /api/todos/:id - update todo
      - DELETE /api/todos/:id - delete todo

  - title: Add pagination support for list endpoints
    completed: false
    parallel_group: 4
    tags: [api, pagination]

  - title: Implement todo filtering by status and due date
    completed: false
    parallel_group: 4
    tags: [api, filtering]

  - title: Add todo sharing between users
    completed: false
    parallel_group: 4
    tags: [api, sharing]

  # ===========================================================================
  # PARALLEL GROUP 5: Polish phase (after core features)
  # ===========================================================================
  - title: Add request validation with detailed error messages
    completed: false
    parallel_group: 5
    tags: [api, validation]

  - title: Implement rate limiting middleware
    completed: false
    parallel_group: 5
    tags: [middleware, security]

  - title: Add OpenAPI/Swagger documentation
    completed: false
    parallel_group: 5
    tags: [docs, api]

  # ===========================================================================
  # PARALLEL GROUP 6: Testing (after everything else)
  # ===========================================================================
  - title: Write integration tests for all endpoints
    completed: false
    parallel_group: 6
    tags: [testing]

# Metadata for tracking
metadata:
  created_at: "2024-01-15"
  updated_at: "2024-01-17"
  owner: developer@example.com
